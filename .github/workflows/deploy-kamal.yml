name: Deploy (Kamal → VPS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-kamal
  cancel-in-progress: false

jobs:
  tests:
    name: 🧪 Tests (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: gd, intl, bcmath, zip, sqlite3, pdo_sqlite
          coverage: none
      - name: 📦 Composer
        run: composer install --no-interaction --prefer-dist
      - name: 🔑 .env de teste
        run: cp .env.example .env && php artisan key:generate
      - name: 🧪 Laravel tests
        run: php artisan test

  deploy:
    name: 🚀 Kamal deploy
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 🔐 Tailscale (tag:ci, só SSH na VPS)
        uses: tailscale/github-action@v4
        with:
          # Credencial OIDC do Tailscale (sem segredo): só repo:brunoinds/maranatha-*, só gera chaves tag:ci
          oauth-client-id: TBERsbsTsB11CNTRL-kXDtT6kwp621CNTRL
          audience: api.tailscale.com/TBERsbsTsB11CNTRL-kXDtT6kwp621CNTRL
          tags: tag:ci

      - name: 🔑 Chave SSH do usuário deploy
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: 💎 Kamal
        run: gem install kamal -v '~> 2.8' --no-document

      - uses: docker/setup-buildx-action@v3
      # Expõe ACTIONS_RUNTIME_TOKEN para o cache "gha" do build
      - uses: crazy-max/ghaction-github-runtime@v3

      - name: 🚀 kamal deploy
        run: kamal deploy
