# Kamal 2: deploy da API na VPS Hostinger (prolux-vps). O GitHub Actions entra pelo Tailscale (host "prolux-vps").
service: maranatha-api
image: brunoinds/maranatha-api

servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_HOST", "prolux-vps") %>
    env:
      clear:
        # Migrations e caches (config/route/view/event) na subida do container web
        AUTORUN_ENABLED: "true"
        AUTORUN_LARAVEL_STORAGE_LINK: "false"
        # Sem config:cache: o código chama env() direto (APP_PRIVATE_KEY, APP_WEB_URL, chaves de API...),
        # e com a config em cache o env() volta null
        AUTORUN_LARAVEL_CONFIG_CACHE: "false"
  # Scheduler (backups no Drive e push do OneSignal): nunca rodar junto com o cron do cPanel antigo,
  # dois schedulers mandam notificação em dobro e mexem nos mesmos backups do Drive.
  scheduler:
    hosts:
      - <%= ENV.fetch("KAMAL_HOST", "prolux-vps") %>
    cmd: php /var/www/html/artisan schedule:work
    proxy: false
    # O healthcheck padrão da imagem é HTTP (porta 8080), que este container não serve
    options:
      health-cmd: healthcheck-schedule

# maranatha.top fica atrás do proxy do Cloudflare (SSL Full strict): o certificado é de origem do Cloudflare,
# 15 anos, e a chave só existe na VPS (/etc/ssl/cloudflare-origin). Ver .kamal/secrets.
proxy:
  hosts:
    - maranatha.top
    - www.maranatha.top
  ssl:
    certificate_pem: CF_ORIGIN_CERT_PEM
    private_key_pem: CF_ORIGIN_KEY_PEM
  app_port: 8080
  healthcheck:
    path: /api/cd/check
    interval: 3
    timeout: 5

registry:
  server: ghcr.io
  username: brunoinds
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  cache:
    type: gha
    options: mode=max

ssh:
  user: deploy

env:
  clear:
    APP_ENV: production
    # Só aceita tráfego vindo do Cloudflare: o IP da VPS não serve a API direto
    ONLY_CLOUDFLARE: "true"
    DB_CONNECTION: sqlite
    DB_DATABASE: /var/www/html/database/data/database.sqlite
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PREFIX: "maranatha_"
    LOG_LEVEL: warning
    LOG_CHANNEL: daily

# Segredos: o .env de produção fica só no servidor (/srv/apps/maranatha/.env, root:www-data 640)
volumes:
  - /srv/apps/maranatha/.env:/var/www/html/.env:ro
  - /srv/apps/maranatha/storage:/var/www/html/storage
  - /srv/apps/maranatha/database:/var/www/html/database/data
  - /srv/apps/maranatha/ionic:/var/www/html/resources/ionic

deploy_timeout: 120
retain_containers: 3

aliases:
  console: app exec --interactive --reuse "php artisan tinker"
  shell: app exec --interactive --reuse "bash"
  artisan: app exec --reuse "php artisan"
